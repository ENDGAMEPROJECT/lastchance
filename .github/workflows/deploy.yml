name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: [main]
  # ...and allow manual runs from the Actions tab
  workflow_dispatch:

# The action pushes the built site to the gh-pages branch
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # xAPI LRS config. Vite reads VITE_-prefixed vars from the
          # environment as well as from .env (which is gitignored, so it
          # never reaches the runner). Set these in the repo's
          # Settings > Secrets and variables > Actions. If they are
          # missing the build still succeeds and tracking stays disabled.
          VITE_XAPI_ENDPOINT: ${{ secrets.VITE_XAPI_ENDPOINT }}
          VITE_XAPI_AUTH: ${{ secrets.VITE_XAPI_AUTH }}

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # peaceiris adds .nojekyll automatically so Vite's assets/ folder is served as-is
